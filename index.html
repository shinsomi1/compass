function wrapText(ctx,text,x,y,maxW,lh,maxLines){
  const out=[];let line='';
  for(const ch of String(text)){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch.trim()?ch:'';}else line=t;}
  if(line)out.push(line);
  const lines=maxLines?out.slice(0,maxLines):out;
  if(maxLines&&out.length>maxLines){let l=lines[maxLines-1];while(ctx.measureText(l+'…').width>maxW&&l)l=l.slice(0,-1);lines[maxLines-1]=l+'…';}
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));return lines.length;
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

      ${a!==undefined?`<div class="verdict ${a===ok?'ok':'bad'}"><b>${a===ok?'정답이에요.':'아쉬워요.'}</b> ${ex}</div><button class="btn" id="q-next">${st.i+1<QUIZ.length?'다음 문제':'결과 보기'}</button>`:''}

   <button class="btn" id="mk5" style="background:#FF375F;color:#fff">카드 만들기</button><div class="out" id="out5" hidden></div></div>`;

    x.fillStyle='#FFE8ED';x.fillRect(0,0,1080,1350);x.fillStyle='#FFFDF7';rr(x,70,70,940,1210,56);x.fill();
    x.fillStyle='#FF375F';x.beginPath();const hx=880,hy=200;x.moveTo(hx,hy+40);x.bezierCurveTo(hx-70,hy,hx-60,hy-55,hx-25,hy-55);x.bezierCurveTo(hx-10,hy-55,hx,hy-45,hx,hy-30);x.bezierCurveTo(hx,hy-45,hx+10,hy-55,hx+25,hy-55);x.bezierCurveTo(hx+60,hy-55,hx+70,hy,hx,hy+40);x.fill();
    x.fillStyle='#C7254E';x.font=`700 40px ${FF}`;x.fillText('To.',150,220);x.fillStyle='#1C1C1E';x.font=`900 64px ${FF}`;x.fillText(c5.to||'친구',230,222);
    x.fillStyle='#EADFC8';for(let i=0;i<6;i++)x.fillRect(150,350+i*96,780,2);
    x.fillStyle='#1C1C1E';x.font=`500 46px ${FF}`;wrapText(x,c5.msg||'너를 응원해!',150,330,780,96,6);
    const v=verses[c5.v||0];x.fillStyle='#FFE8ED';rr(x,150,960,780,170,28);x.fill();x.fillStyle='#7A1530';x.font=`500 36px ${FF}`;wrapText(x,v[0],190,1030,700,48,2);x.font=`700 28px ${FF}`;x.fillText(v[1],190,1105);
    x.textAlign='right';x.fillStyle='#C7254E';x.font=`700 40px ${FF}`;x.fillText('From. '+(S.nick||''),930,1215);
    showImage($('#out5'),c,'친구에게 보낼 응원 카드');};

/* 6과: 서약서 + 다시 체크 */
function act6(l){
  const p=S.pledge;
  $('#act').innerHTML=`<div class="card" style="border:2px solid #5E5CE6"><p style="font-weight:900;font-size:18px">AI 사용 서약서</p><p class="small muted">나는 하나님이 맡기신 도구인 AI를 선하게 쓰는 청지기가 되겠습니다.</p>
   <label for="pl-0">1. 나는 AI를 ___에 사용하겠습니다.</label><input type="text" id="pl-0" maxlength="40" value="${esc((p.a||[])[0]||'')}">
   <label for="pl-1">2. 나는 AI를 ___에는 사용하지 않겠습니다.</label><input type="text" id="pl-1" maxlength="40" value="${esc((p.a||[])[1]||'')}">
   <label for="pl-2">3. 나는 AI보다 먼저 ___하겠습니다.</label><input type="text" id="pl-2" maxlength="40" value="${esc((p.a||[])[2]||'')}">
   <div class="btns"><button class="btn" id="pl-save" style="background:#5E5CE6;color:#fff">서명하고 저장</button><span class="small muted" id="pl-msg" style="align-self:center">${p.date?`${esc(p.date)} 서명함`:''}</span></div></div>
   <h2>6주 뒤 다시 체크</h2>${checkForm('post','지금 나는 얼마나 자주 할까요?')}<div id="cmp"></div>
   <button class="btn" data-go="card" style="background:#1C1C1E;color:#fff">나침반 카드 · 배경화면 만들기 ›</button>`;
  $('#pl-save').onclick=()=>{p.a=[0,1,2].map(i=>$('#pl-'+i).value.trim());const d=new Date();p.date=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;save();$('#pl-msg').textContent=`${p.date} 서명함`;};
  const cmp=()=>{const a=S.pre||[],b=S.post||[];if(!a.length||!b.length){$('#cmp').innerHTML=a.length?'':'<p class="note">‘들어가며’에서 시작 전 체크를 하면 변화를 비교해 볼 수 있어요.</p>';return;}
    $('#cmp').innerHTML=`<div class="card"><p style="font-weight:700">6주 동안 달라진 점</p>${CHECK_Q.map((q,i)=>{if(a[i]==null||b[i]==null)return'';const d=b[i]-a[i];

/* 부록: 나침반 카드 · 배경화면 */
const THEMES={night:{bg:'#1C1C1E',card:'#2C2C2E',fg:'#FFFFFF',mut:'#AEAEB2',sep:'#48484A',name:'밤하늘'},dawn:{bg:'#F2F2F7',card:'#FFFFFF',fg:'#1C1C1E',mut:'#6C6C70',sep:'#E5E5EA',name:'새벽'},sun:{bg:'#FF9F0A',card:'#FFF4E5',fg:'#1C1C1E',mut:'#5C2A00',sep:'#FFD199',name:'햇살'},deep:{bg:'#2E2C8A',card:'#3B39A8',fg:'#FFFFFF',mut:'#C9C8FF',sep:'#5250C0',name:'깊은 바다'},mint:{bg:'#E3F6F9',card:'#FFFFFF',fg:'#0B4F5C',mut:'#0E7A8C',sep:'#B5E6EE',name:'민트'}};
function viewCard(){
  const th=S.wall.theme||'night';
  app.innerHTML=`${topbar('','부록')}
  <div class="row"><div class="ico" style="width:64px;height:64px;background:#FFF4E5">${svgIcon('card',32,'#C25A00')}</div><div><span class="small" style="font-weight:700;color:var(--t1)">부록 · 6주의 열매</span><h1>나의 믿음 나침반 카드</h1></div></div>
  <div class="card"><div class="compass-wrap">${compassSVG(110)}<div class="list" style="flex:1;min-width:0">${['c','n','e','s','w','b'].map(k=>`<div class="li" style="padding:6px 0"><span class="chip" style="flex:none;background:${DIRS[k].fill};color:${DIRS[k].ink}">${DIRS[k].name}</span><span class="small" style="min-width:0;overflow-wrap:anywhere">${esc(cellText(k))||'<span class="muted">아직 비어 있어요</span>'}</span></div>`).join('')}</div></div>
   <p class="note">${filled()<6?`${6-filled()}칸이 남았어요. 각 과 화면에서 채울 수 있어요.`:'여섯 칸을 모두 채웠어요!'}</p></div>
  <h2>배경화면 만들기</h2>
  <div class="card"><span style="font-size:14px;font-weight:700">색 고르기</span><div class="themes" role="group" aria-label="배경 색">${Object.entries(THEMES).map(([k,t])=>`<button class="sw" data-th="${k}" aria-pressed="${k===th}" aria-label="${t.name}" title="${t.name}" style="background:${t.bg};box-shadow:inset 0 0 0 1px ${t.sep}"></button>`).join('')}</div>
   <button class="btn" id="mkw">배경화면 이미지 만들기</button><div class="out" id="outw" hidden></div></div>`;
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.wall.theme=b.dataset.th;save();document.querySelectorAll('[data-th]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  $('#mkw').onclick=async()=>{await fontsReady();const t=THEMES[S.wall.theme||'night'];
    const c=document.createElement('canvas');c.width=1170;c.height=2532;const x=c.getContext('2d');
    x.fillStyle=t.bg;x.fillRect(0,0,1170,2532);
    // compass (lower half keeps the clock area free)
    const cx=585,cy=1180,R=300,on=k=>(S.cells[k]||'').trim();
    x.lineWidth=34;x.strokeStyle=on('b')?'#5E5CE6':t.sep;x.beginPath();x.arc(cx,cy,R,0,7);x.stroke();
    x.fillStyle=t.card;x.beginPath();x.arc(cx,cy,R-30,0,7);x.fill();
    x.strokeStyle=t.sep;x.lineWidth=4;x.beginPath();x.moveTo(cx,cy-200);x.lineTo(cx,cy+200);x.moveTo(cx-200,cy);x.lineTo(cx+200,cy);x.stroke();
    const P={n:[0,-185],e:[185,0],s:[0,185],w:[-185,0]};x.textAlign='center';x.textBaseline='middle';
    for(const k of ['n','e','s','w']){const d=DIRS[k];x.fillStyle=on(k)?d.fill:t.sep;x.beginPath();x.arc(cx+P[k][0],cy+P[k][1],62,0,7);x.fill();x.fillStyle=on(k)?d.ink:t.mut;x.font=`900 46px ${FF}`;x.fillText(d.name,cx+P[k][0],cy+P[k][1]+2);}
    x.fillStyle=on('c')?DIRS.c.fill:t.sep;x.beginPath();x.arc(cx,cy,78,0,7);x.fill();x.fillStyle=on('c')?'#1C1C1E':t.mut;x.font=`900 42px ${FF}`;x.fillText('중심',cx,cy+2);
    x.textBaseline='alphabetic';x.fillStyle=t.mut;x.font=`700 40px ${FF}`;x.fillText((S.nick?S.nick+'의 ':'나의 ')+'믿음 나침반',cx,800);
    // lines
    x.textAlign='left';let y=1590;
    for(const k of ['c','n','e','s','w','b']){const d=DIRS[k];x.fillStyle=d.fill;rr(x,150,y-44,150,60,30);x.fill();x.fillStyle=d.ink;x.font=`700 30px ${FF}`;x.textAlign='center';x.fillText(d.name,225,y-4);x.textAlign='left';
      x.fillStyle=cellText(k)?t.fg:t.mut;x.font=`500 38px ${FF}`;wrapText(x,cellText(k)||'—',330,y,690,46,1);y+=100;}
    x.textAlign='center';x.fillStyle=t.mut;x.font=`500 34px ${FF}`;x.fillText('주의 말씀은 내 발에 등이요 내 길에 빛이니이다',cx,2280);x.font=`700 30px ${FF}`;x.fillText('시편 119:105',cx,2330);
    showImage($('#outw'),c,'나의 믿음 나침반 배경화면');};
}

  app.innerHTML=`${topbar('','기록 옮기기')}<h1>기록 옮기기</h1>
  <div class="card"><p>기록은 이 휴대폰의 이 브라우저에만 저장돼요. 휴대폰을 바꾸거나 다른 앱으로 QR을 열었다면, 아래 코드를 복사해 새 화면에 붙여 넣으세요.</p>
   <label for="bk-out">나의 기록 코드</label><textarea id="bk-out" readonly style="font-size:12px;min-height:90px">${esc(code)}</textarea>
   <div class="btns"><button class="btn" id="bk-copy">코드 복사</button><span class="small muted" id="bk-cmsg" style="align-self:center"></span></div></div>
  <div class="card"><label for="bk-in">다른 기기의 코드 붙여 넣기</label><textarea id="bk-in" style="font-size:12px;min-height:90px"></textarea>
   <div class="btns"><button class="btn ghost" id="bk-load">불러오기</button><span class="small" id="bk-lmsg" style="align-self:center"></span></div>
   <p class="note">불러오면 지금 이 화면의 기록이 코드의 기록으로 바뀌어요.</p></div>`;
  $('#bk-copy').onclick=async()=>{const t=$('#bk-out');try{await navigator.clipboard.writeText(t.value);$('#bk-cmsg').textContent='복사했어요';}catch(e){t.select();$('#bk-cmsg').textContent='코드가 선택됐어요. 직접 복사해 주세요';}};
  $('#bk-load').onclick=()=>{const m=$('#bk-lmsg');try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk-in').value.trim()))));if(!o||typeof o!=='object'||!('cells' in o))throw 0;
    S=Object.assign({nick:'',cells:{},missions:{},pre:null,post:null,profile:{},quiz:{},decide:{},screen:{},cheer:{},pledge:{},wall:{theme:'night'}},o);save();m.style.color='var(--ok)';m.textContent='불러왔어요';}
    catch(e){m.style.color='var(--bad)';m.textContent='코드를 읽을 수 없어요. 전체를 빠짐없이 붙여 넣었는지 확인해 주세요.';}};
}

/* ---------- router ---------- */
function render(){
  const h=(location.hash||'').replace('#','');
  if(L(h))viewLesson(L(h));else if(h==='intro')viewIntro();else if(h==='card')viewCard();else if(h==='backup')viewBackup();else viewHome();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;const to=g.dataset.go;
  if(('#'+to)===location.hash||(!to&&!location.hash))render();else location.hash=to;});
window.addEventListener('hashchange',render);
render();
})();
</script>
